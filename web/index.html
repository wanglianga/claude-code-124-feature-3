<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>凌晨鲜花批发市场 · 竞价分货与损耗服务</title>
<style>
  :root { --bg:#0f141b; --card:#1a2230; --line:#2a3547; --txt:#e8eef7; --dim:#8fa0b8;
          --acc:#ff5d8f; --acc2:#3ec6a7; --warn:#ffb020; --bad:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
         background:var(--bg); color:var(--txt); }
  header { display:flex; align-items:center; gap:12px; padding:12px 20px; background:var(--card);
           border-bottom:1px solid var(--line); position:sticky; top:0; z-index:9; }
  header h1 { font-size:17px; margin:0; }
  header .who { margin-left:auto; color:var(--dim); font-size:13px; }
  button { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:7px 14px;
           cursor:pointer; font-size:13px; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--txt); }
  button.small { padding:3px 9px; font-size:12px; }
  button.green { background:var(--acc2); }
  button.warn { background:var(--warn); color:#222; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  input,select,textarea { background:#0d1219; color:var(--txt); border:1px solid var(--line);
           border-radius:7px; padding:7px 9px; font-size:13px; }
  label { font-size:12px; color:var(--dim); display:block; margin:8px 0 3px; }
  .layout { display:flex; min-height:calc(100vh - 53px); }
  nav { width:168px; padding:14px 10px; border-right:1px solid var(--line); flex-shrink:0; }
  nav a { display:block; padding:9px 12px; border-radius:8px; color:var(--dim); cursor:pointer;
          font-size:14px; margin-bottom:4px; text-decoration:none; }
  nav a.on { background:var(--acc); color:#fff; }
  main { flex:1; padding:18px 22px; overflow-x:auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:16px; margin-bottom:16px; }
  .card h3 { margin:0 0 12px; font-size:15px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { padding:7px 8px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
  th { color:var(--dim); font-weight:500; }
  .badge { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px;
           background:#26314a; color:var(--dim); }
  .badge.g { background:rgba(62,198,167,.18); color:var(--acc2); }
  .badge.y { background:rgba(255,176,32,.16); color:var(--warn); }
  .badge.r { background:rgba(255,107,107,.16); color:var(--bad); }
  .badge.p { background:rgba(255,93,143,.16); color:var(--acc); }
  .grid { display:grid; gap:14px; }
  .grid.c4 { grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .stat .n { font-size:24px; font-weight:600; }
  .stat .t { color:var(--dim); font-size:12px; margin-top:4px; }
  .bar { height:8px; background:#0d1219; border-radius:99px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--acc2); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
  .muted { color:var(--dim); font-size:12px; }
  .err { color:var(--bad); font-size:13px; margin:8px 0; }
  .ok { color:var(--acc2); font-size:13px; margin:8px 0; }
  #toast { position:fixed; top:64px; right:20px; z-index:99; display:flex; flex-direction:column; gap:8px; }
  #toast div { background:#26314a; border:1px solid var(--line); padding:10px 16px; border-radius:9px;
               font-size:13px; max-width:360px; }
  #toast div.e { border-color:var(--bad); color:var(--bad); }
  .login-wrap { max-width:460px; margin:8vh auto; }
  .acct { display:inline-block; margin:3px; }
  h4.sec { margin:18px 0 8px; color:var(--dim); font-weight:500; }
</style>
</head>
<body>
<div id="toast"></div>
<header>
  <h1>🌹 凌晨鲜花批发市场 · 竞价分货与损耗服务</h1>
  <span class="who" id="who"></span>
  <button class="ghost small" id="bellBtn" style="display:none" onclick="toggleNotif()">🔔 <span id="bellN"></span></button>
  <button class="ghost small" id="logoutBtn" style="display:none" onclick="logout()">退出登录</button>
</header>
<div id="notifPanel" style="display:none;position:fixed;top:52px;right:16px;z-index:98;width:360px;max-height:60vh;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:12px"></div>

<div id="loginView" class="login-wrap" style="display:none">
  <div class="card">
    <h3>登录市场工作台</h3>
    <label>用户名</label>
    <input id="loginUser" style="width:100%" placeholder="如 farmer01">
    <label>密码</label>
    <input id="loginPass" type="password" style="width:100%" placeholder="演示账号统一 flower123">
    <div class="err" id="loginErr"></div>
    <button style="width:100%;margin-top:10px" onclick="doLogin()">登 录</button>
    <h4 class="sec">演示账号一键填充（密码均为 flower123）</h4>
    <div id="acctList"></div>
  </div>
</div>

<div id="appView" class="layout" style="display:none">
  <nav id="menu"></nav>
  <main id="view"></main>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CAT = {rose:'玫瑰',lily:'百合',tulip:'郁金香',eustoma:'洋桔梗',eucalyptus:'尤加利',holiday_mix:'节日混搭'};
const PURPOSE = {wedding:'婚礼',retail:'门店零售',livestream:'直播花束',enterprise:'企业订单'};
const REASON = {petal_drop:'到店掉瓣',quality:'品质不符',temp_damage:'冷链失温',short_stem:'短枝过多',other:'其他'};
const SENS = {high:'高敏感',medium:'中敏感',low:'低敏感'};
const HOLD_METHOD = {ice_box:'冰袋保温箱',refrigerated_truck:'冷藏车暂存',insulated_cover:'保温被覆盖',cool_room:'临租小冷库',other:'其他'};
const RESP = {coldstore:'冷库',wholesaler:'批发商',farmer:'花农',broker:'经纪人',disputed:'分歧待协调'};
const HSTATUS = {active:'保温中',stored:'已入库',failed:'保温失败'};
const ESTATUS = {pending:'待经纪人确认',confirmed:'已确认'};
const TIMESLOTS = ['00:00-02:00','02:00-04:00','04:00-06:00','06:00-08:00'];
const ROLE = {farmer:'花农',broker:'经纪人',qc:'质检',wholesaler:'批发商',shop:'花店采购',coldstore:'冷库',logistics:'配送',finance:'财务',manager:'市场管理'};
const BSTATUS = {qc_pending:'待质检',qc_passed:'质检通过',qc_flagged:'质检打回',stored:'已入库',in_auction:'竞价中',sold:'已售出',expired:'已报损',closed:'已出清'};
const ASTATUS = {active:'进行中',closed:'已成交',unsold:'流拍',cancelled:'已取消'};
const OSTATUS = {pending_payment:'待付款',paid:'已付款',dispatched:'配送中',delivered:'已送达',completed:'已完成',cancelled:'已取消',timeout_cancelled:'超时取消'};
const RSTATUS = {requested:'待审核',approved:'已赔付',rejected:'已驳回'};
const RECV = {open:'未到期',overdue:'已逾期',settled:'已结清'};
const TSTATUS = {pending:'待发车',in_transit:'在途',delivered:'已送达',arrived:'已到达'};
const money = n => '¥' + Number(n||0).toFixed(2);
const fmtT = s => s ? new Date(s).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
const badge = (txt,cls='') => `<span class="badge ${cls}">${txt}</span>`;
const stBadge = (map,v) => { const c = /报损|打回|驳回|取消|逾期|超时/.test(map[v]||v)?'r':(/待|在途|进行中|锁定/.test(map[v]||v)?'y':(/售|成交|送达|付款|通过|赔付|到达|结清/.test(map[v]||v)?'g':'')); return badge(map[v]||v,c); };
const flagsTxt = f => (f||'').split(',').filter(Boolean).map(x=>({uneven_openness:'开放度不均',high_short_stem:'短枝比例高',temp_abnormal:'冷链失温',over_opened:'开放过快'}[x]||x)).join('、');

let S = { token: localStorage.getItem('fm_tok')||'', me: JSON.parse(localStorage.getItem('fm_me')||'null'), view:'' };

function toast(msg, isErr){
  const d = document.createElement('div');
  if(isErr) d.className='e';
  d.textContent = msg;
  $('#toast').appendChild(d);
  setTimeout(()=>d.remove(), isErr?6000:3000);
}

async function api(path, method='GET', body){
  const opt = { method, headers: {} };
  if(S.token) opt.headers['Authorization'] = 'Bearer '+S.token;
  if(body !== undefined){ opt.headers['Content-Type']='application/json'; opt.body = JSON.stringify(body); }
  const r = await fetch('/api'+path, opt);
  let j = null;
  try { j = await r.json(); } catch(e){}
  if(!r.ok){
    if(r.status===401){ logout(); }
    throw new Error((j&&j.error)||('HTTP '+r.status));
  }
  return j;
}
const run = fn => async (...a) => { try { await fn(...a); } catch(e){ toast(e.message, true); } };

const ACCOUNTS = [
  ['farmer01','花农·昆明老张'],['farmer02','花农·凌源小李'],['broker01','经纪人·王姐'],
  ['qc01','质检员·陈工'],['wholesaler01','批发商·恒信'],['wholesaler02','批发商·馨源'],
  ['shop01','花店·城南花坊'],['shop02','婚庆·喜结良缘(账期)'],['shop03','花店·直播小艾'],
  ['cold01','冷库·赵班长'],['ship01','配送·孙师傅'],['fin01','财务·刘会计'],['boss01','市场管理·吴经理'],
];

function renderLogin(){
  $('#acctList').innerHTML = ACCOUNTS.map(a=>
    `<button class="ghost small acct" onclick="$('#loginUser').value='${a[0]}';$('#loginPass').value='flower123'">${a[1]}</button>`).join('');
}
async function doLogin(){
  $('#loginErr').textContent = '';
  try{
    const j = await api('/auth/login','POST',{username:$('#loginUser').value.trim(),password:$('#loginPass').value});
    S.token = j.token; S.me = j.user;
    localStorage.setItem('fm_tok', j.token);
    localStorage.setItem('fm_me', JSON.stringify(j.user));
    enter();
  }catch(e){ $('#loginErr').textContent = e.message; }
}
function logout(){
  if(S.token) api('/auth/logout','POST').catch(()=>{});
  S.token=''; S.me=null;
  localStorage.removeItem('fm_tok'); localStorage.removeItem('fm_me');
  location.reload();
}

const MENUS = {
  farmer:     [['batches','到货登记'],['dash','市场看板']],
  broker:     [['batches','到货登记'],['coldchain','入场调整'],['dash','市场看板']],
  qc:         [['qc','质检台'],['returns','退货审核'],['storage','冷库与保鲜'],['dash','市场看板']],
  wholesaler: [['auctions','凌晨竞价大厅'],['inventory','我的库存'],['orders','销售订单'],['coldchain','损耗确认'],['dash','市场看板']],
  shop:       [['market','采购市场'],['orders','我的订单'],['dash','市场看板']],
  coldstore:  [['storage','冷库与保鲜'],['coldchain','调度与保温'],['dash','市场看板']],
  logistics:  [['deliveries','配送调度'],['dash','市场看板']],
  finance:    [['finance','财务结算'],['dash','市场看板']],
  manager:    [['dash','市场看板'],['admin','拍卖管理'],['coldchain','冷库调度'],['auctions','竞价大厅'],['returns','退货对账'],['finance','财务结算']],
};

/* ---------------- 站内通知 ---------------- */
async function refreshBell(){
  if(!S.token) return;
  try{
    const j = await api('/notifications');
    S.notifs = j.items||[];
    $('#bellN').textContent = j.unread>0 ? j.unread : '';
    $('#bellBtn').style.display = '';
  }catch(e){}
}
function toggleNotif(){
  const p = $('#notifPanel');
  if(p.style.display==='none'||!p.style.display){ renderNotifs(); p.style.display='block'; }
  else p.style.display='none';
}
function renderNotifs(){
  $('#notifPanel').innerHTML = '<div style="padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px"><b>站内通知</b></div>'+
    (S.notifs||[]).map(n=>`
    <div style="padding:8px 12px;border-bottom:1px solid var(--line);${n.read_at?'opacity:.55':''}">
      <div style="font-size:13px">${esc(n.title)}</div>
      <div class="muted" style="font-size:12px;margin-top:2px">${esc(n.body)}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:5px">
        <span class="muted" style="font-size:11px">${fmtT(n.created_at)}</span>
        ${n.read_at?'':`<button class="small ghost" onclick="readNotif(${n.id})">标记已读</button>`}
      </div>
    </div>`).join('')||'<div class="muted" style="padding:12px">暂无通知</div>';
}
const readNotif = run(async id=>{
  await api('/notifications/'+id+'/read','POST',{});
  await refreshBell(); renderNotifs();
});

function enter(){
  $('#loginView').style.display='none';
  $('#appView').style.display='flex';
  $('#logoutBtn').style.display='';
  $('#who').textContent = `${S.me.name}（${ROLE[S.me.role]||S.me.role}）`;
  const menu = MENUS[S.me.role]||[['dash','市场看板']];
  $('#menu').innerHTML = menu.map(m=>`<a data-v="${m[0]}" onclick="go('${m[0]}')">${m[1]}</a>`).join('');
  refreshBell();
  if(!S.bellTimer) S.bellTimer = setInterval(refreshBell, 30000);
  go(menu[0][0]);
}
function go(v){
  S.view = v;
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on', a.dataset.v===v));
  VIEWS[v]();
}

/* ---------------- 看板 ---------------- */
async function vDash(){
  const [ov, st, rank] = await Promise.all([
    api('/analytics/overview'), api('/analytics/stability'), api('/farmers/ranking')]);
  const c = ov.counts||{};
  const occ = (ov.storage_slots||[]).reduce((a,s)=>a+s.occupied_bundles,0);
  const cap = (ov.storage_slots||[]).reduce((a,s)=>a+s.capacity_bundles,0);
  const overdue = (ov.credit_risk||[]).reduce((a,x)=>a+x.overdue_amount,0);
  const retClaim = (ov.return_loss||[]).reduce((a,x)=>a+x.claim_amount,0);
  $('#view').innerHTML = `
  <div class="grid c4">
    <div class="stat"><div class="n">${c.active_auctions||0}</div><div class="t">进行中的凌晨竞价</div></div>
    <div class="stat"><div class="n">${occ}/${cap}</div><div class="t">冷库占用（扎）</div></div>
    <div class="stat"><div class="n">${money(retClaim)}</div><div class="t">累计退货赔付</div></div>
    <div class="stat"><div class="n" style="color:var(--bad)">${money(overdue)}</div><div class="t">账期逾期金额</div></div>
    <div class="stat"><div class="n">${c.pending_orders||0}</div><div class="t">待付款订单</div></div>
    <div class="stat"><div class="n">${c.timeout_orders||0}</div><div class="t">超时未付款取消</div></div>
    <div class="stat"><div class="n">${c.requested_returns||0}</div><div class="t">待审核退货</div></div>
    <div class="stat"><div class="n">${c.expired_batches||0}</div><div class="t">报损批次</div></div>
    <div class="stat"><div class="n" style="color:var(--warn)">${c.holding_active||0}</div><div class="t">临时保温中（库位不足）</div></div>
    <div class="stat"><div class="n" style="color:var(--bad)">${c.holding_pending_confirm||0}</div><div class="t">保温失败待双签</div></div>
    <div class="stat"><div class="n">${c.entry_adjustments_pending||0}</div><div class="t">入场调整待经纪人确认</div></div>
    <div class="stat"><div class="n">${c.entry_adjustments_confirmed||0}</div><div class="t">入场调整已确认</div></div>
  </div>
  <div class="card"><h3>冷库爆满调度 · 临时保温与责任确认</h3>
    <table><tr><th>批次</th><th>品类</th><th>敏感度</th><th>保温方式</th><th>责任方</th><th>状态</th><th>冷库确认</th><th>批发商确认</th><th>最终定责</th></tr>
    ${(ov.cold_holdings||[]).map(x=>`<tr><td>${x.batch_no}</td><td>${CAT[x.category]||x.category}</td>
      <td>${SENS[x.sensitivity]||x.sensitivity}</td><td>${HOLD_METHOD[x.method]||x.method}</td>
      <td>${RESP[x.responsibility]||x.responsibility}</td><td>${stBadge(HSTATUS,x.status)}</td>
      <td>${x.coldstore_confirmed?badge('✓','g'):(x.status==='failed'?badge('待确认','y'):'—')}</td>
      <td>${x.wholesaler_confirmed?badge('✓','g'):(x.status==='failed'?badge('待确认','y'):'—')}</td>
      <td>${x.final_responsibility?badge(RESP[x.final_responsibility]||x.final_responsibility,'p'):'—'}</td></tr>`).join('')||'<tr><td colspan=9 class=muted>当前无临时保温批次</td></tr>'}</table></div>
  <div class="card"><h3>成交速度（按品类 / 产地）</h3>
    <table><tr><th>品类</th><th>产地</th><th>成交笔数</th><th>平均成交耗时</th><th>成交金额</th></tr>
    ${(ov.deal_speed||[]).map(x=>`<tr><td>${CAT[x.category]||x.category}</td><td>${esc(x.origin)}</td>
      <td>${x.deals}</td><td>${x.avg_minutes} 分钟</td><td>${money(x.amount)}</td></tr>`).join('')||'<tr><td colspan=5 class=muted>暂无成交</td></tr>'}</table></div>
  <div class="card"><h3>冷库占用</h3>
    <div class="grid c4">${(ov.storage_slots||[]).map(s=>`
      <div><div style="display:flex;justify-content:space-between;font-size:13px">
        <b>${s.code}</b><span class="muted">${s.occupied_bundles}/${s.capacity_bundles} 扎</span></div>
      <div class="bar"><i style="width:${Math.min(100,s.occupied_bundles/s.capacity_bundles*100)}%"></i></div></div>`).join('')}</div></div>
  <div class="card"><h3>退货损耗（按品类 / 产地）</h3>
    <table><tr><th>品类</th><th>产地</th><th>售出(扎)</th><th>退货(扎)</th><th>退货率</th><th>赔付金额</th></tr>
    ${(ov.return_loss||[]).map(x=>`<tr><td>${CAT[x.category]||x.category}</td><td>${esc(x.origin)}</td>
      <td>${x.sold_bundles}</td><td>${x.returned_bundles}</td><td>${x.return_rate_pct}%</td><td>${money(x.claim_amount)}</td></tr>`).join('')||'<tr><td colspan=6 class=muted>暂无</td></tr>'}</table></div>
  <div class="card"><h3>账期风险</h3>
    <table><tr><th>账期客户</th><th>额度</th><th>未到期</th><th>已逾期</th><th>最长逾期</th></tr>
    ${(ov.credit_risk||[]).map(x=>`<tr><td>${esc(x.customer)}</td><td>${money(x.credit_limit)}</td>
      <td>${money(x.open_amount)}</td><td>${x.overdue_amount>0?badge(money(x.overdue_amount),'r'):money(0)}</td>
      <td>${x.max_overdue_days} 天</td></tr>`).join('')||'<tr><td colspan=5 class=muted>暂无账期客户</td></tr>'}</table></div>
  <div class="card"><h3>产地 × 品类稳定性（辅助调整凌晨拍卖秩序）</h3>
    <table><tr><th>产地</th><th>品类</th><th>批次数</th><th>质检均分</th><th>冷链达标率</th><th>退货率</th><th>稳定性评分</th></tr>
    ${st.map(x=>`<tr><td>${esc(x.origin)}</td><td>${CAT[x.category]||x.category}</td><td>${x.batches}</td>
      <td>${x.grade_avg}</td><td>${x.temp_ok_rate}%</td><td>${x.return_rate_pct}%</td>
      <td>${badge(x.stability_score, x.stability_score>=75?'g':(x.stability_score>=55?'y':'r'))}</td></tr>`).join('')}</table></div>
  <div class="card"><h3>花农信用排名（决定下次竞价排序）</h3>
    <table><tr><th>名次</th><th>花农</th><th>信用分</th></tr>
    ${rank.map(x=>`<tr><td>${x.rank}</td><td>${esc(x.name)}</td>
      <td>${badge(x.credit_score, x.credit_score>=95?'g':(x.credit_score>=80?'y':'r'))}</td></tr>`).join('')}</table></div>`;
}

/* ---------------- 到货登记（花农/经纪人） ---------------- */
async function vBatches(){
  const [batches, farmers] = await Promise.all([

    ${batches.map(b=>`<tr><td>${b.batch_no}</td><td>${CAT[b.category]||b.category}</td><td>${esc(b.origin)}</td>

      <td>${flagsTxt(b.risk_flags)?badge(flagsTxt(b.risk_flags),'y'):'—'}</td>

const createBatch = run(async ()=>{
  const body = {
    category: $('#b_cat').value, origin: $('#b_origin').value, cut_at: $('#b_cut').value,
    stem_length_cm: +$('#b_stem').value, openness: +$('#b_open').value, bundles: +$('#b_bundles').value,
    stems_per_bundle: +$('#b_spb').value, arrival_temp_c: +$('#b_temp').value, sellable_hours: +$('#b_sell').value,
    sensitivity: $('#b_sens').value, expected_pickup_at: $('#b_pickup').value||'',
  };

  const j = await api('/batches','POST',body);
  toast(`批次 ${j.batch_no} 登记成功（${SENS[j.sensitivity]||''}），待质检`);
  vBatches();
});

  <div class="card"><h3>冷库库位</h3>
    <div class="grid c4">${slots.map(s=>`
      <div class="stat"><div style="display:flex;justify-content:space-between"><b>${s.code}</b>
        <span class="muted">${s.batch_count} 批</span></div>
        <div class="n">${s.occupied_bundles}<span class="muted" style="font-size:13px">/${s.capacity_bundles} 扎</span></div>
        <div class="bar"><i style="width:${Math.min(100,s.occupied_bundles/s.capacity_bundles*100)}%"></i></div>
        <div class="t">剩余 ${s.free_bundles} 扎</div></div>`).join('')}</div></div>

      <div><label>待入库批次</label><select id="st_batch">${unstored.map(b=>

async function vAuctions(){
  const list = await api('/auctions');
  const act = list.filter(a=>a.status==='active');
  const done = list.filter(a=>a.status!=='active');
  const isW = S.me.role==='wholesaler', isM = S.me.role==='manager';
  $('#view').innerHTML = `
  <div class="card"><h3>进行中（按花农信用排序，信用高者先拍）</h3>
  ${act.length===0?'<div class="muted">暂无进行中的场次</div>':act.map(a=>`
    <div class="card" style="background:#141b26">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <b>#${a.id} ${CAT[a.batch.category]||a.batch.category}</b>
        ${badge(a.mode==='auction'?'竞价':'一口价','p')}
        <span class="muted">${a.batch.batch_no} · ${esc(a.batch.origin)} · ${a.batch.grade||'未评级'}级 · ${a.batch.bundles} 扎</span>
        ${a.batch.risk_flags?badge(flagsTxt(a.batch.risk_flags),'y'):''}
        <span style="margin-left:auto">花农 ${esc(a.farmer_name)} ${badge('信用 '+a.farmer_credit, a.farmer_credit>=95?'g':'y')}</span>
      </div>
      <div style="display:flex;gap:16px;align-items:center;margin-top:10px;flex-wrap:wrap">
        <span>起拍 ${money(a.start_price)}/扎</span>
        ${a.mode==='auction'
          ?`<span>当前最高 <b style="color:var(--acc)">${a.current_price?money(a.current_price):'暂无出价'}</b> · ${a.bid_count} 次出价</span>`
          :`<span>一口价 <b style="color:var(--acc)">${money(a.buy_now_price)}</b>/扎</span>`}
        <span class="muted">结拍 ${fmtT(a.ends_at)}</span>
        ${isW && a.mode==='auction'?`<span><input id="bid_${a.id}" type="number" placeholder="出价/扎" style="width:100px">
          <button class="small" onclick="doBid(${a.id})">出价</button></span>`:''}
        ${isW && a.mode==='fixed'?`<button class="small green" onclick="doBuyNow(${a.id})">一口价成交</button>`:''}
        ${isM?`<button class="small warn" onclick="doClose(${a.id})">提前结拍</button>`:''}
      </div>
    </div>`).join('')}</div>
  <div class="card"><h3>近期已结束</h3>
    <table><tr><th>#</th><th>品类</th><th>批次</th><th>模式</th><th>成交价</th><th>状态</th><th>结拍时间</th></tr>
    ${done.map(a=>`<tr><td>${a.id}</td><td>${CAT[a.batch.category]||a.batch.category}</td><td>${a.batch.batch_no}</td>
      <td>${a.mode==='auction'?'竞价':'一口价'}</td><td>${a.current_price?money(a.current_price)+'/扎':'—'}</td>
      <td>${stBadge(ASTATUS,a.status)}</td><td>${fmtT(a.ends_at)}</td></tr>`).join('')||'<tr><td colspan=7 class=muted>暂无</td></tr>'}</table></div>`;
}
const doBid = run(async id=>{
  const price = +$(`#bid_${id}`).value;
  if(!price) return toast('请输入出价', true);
  await api(`/auctions/${id}/bid`,'POST',{price});
  toast('出价成功'); vAuctions();
});
const doBuyNow = run(async id=>{
  const j = await api(`/auctions/${id}/buy-now`,'POST',{});
  toast(`已按一口价 ${money(j.price)}/扎 成交`); vAuctions();
});
const doClose = run(async id=>{
  await api(`/auctions/${id}/close`,'POST',{});
  toast('已结拍'); vAuctions();
});

  <div class="card"><h3>我的库存</h3>
    <table><tr><th>批次</th><th>品类/产地</th><th>可售</th><th>锁定</th><th>总量</th><th>成本价</th><th>挂牌价</th><th>状态</th><th>操作</th></tr>
    ${invs.map(i=>`<tr>
      <td>${i.batch.batch_no}</td><td>${CAT[i.batch.category]||i.batch.category} · ${esc(i.batch.origin)}</td>
      <td>${i.bundles_available}</td><td>${i.bundles_reserved}</td><td>${i.bundles_total}</td>
      <td>${money(i.cost_price)}</td><td>${i.list_price?money(i.list_price):'—'}</td>
      <td>${i.listed?badge('已上架','g'):badge('未上架')} ${i.status!=='in_stock'?badge(i.status==='sold_out'?'售罄':'已调出','r'):''}</td>
      <td>
        <button class="small ghost" onclick="toggleList(${i.id},${!i.listed})">${i.listed?'下架':'上架'}</button>
        <button class="small ghost" onclick="changePrice(${i.id})">改价</button>
        <button class="small ghost" onclick="doTransfer(${i.id},${i.bundles_available})">跨城调货</button>
      </td></tr>`).join('')||'<tr><td colspan=9 class=muted>暂无库存，去竞价大厅拍货</td></tr>'}</table>
    <div class="muted" style="margin-top:6px">改价会留痕（调价记录），未付款订单仍按下单时锁定价结算。</div></div>
  <div class="card"><h3>跨城调货</h3>
    <table><tr><th>#</th><th>批次</th><th>品类</th><th>扎数</th><th>目的城市</th><th>状态</th><th>发起时间</th></tr>
    ${transfers.map(t=>`<tr><td>${t.id}</td><td>${t.batch_no}</td><td>${CAT[t.category]||t.category}</td>
      <td>${t.bundles}</td><td>${esc(t.to_city)}</td><td>${stBadge(TSTATUS,t.status)}</td><td>${fmtT(t.created_at)}</td></tr>`).join('')||'<tr><td colspan=7 class=muted>暂无调货</td></tr>'}</table></div>`;
}
const toggleList = run(async (id, listed)=>{
  let body = {listed};
  if(listed){
    const p = prompt('挂牌价（元/扎）：');
    if(!p) return;
    body.list_price = +p;
  }
  await api(`/inventories/${id}/listing`,'POST',body);
  toast(listed?'已上架':'已下架'); vInventory();
});
const changePrice = run(async id=>{
  const p = prompt('新挂牌价（元/扎）：'); if(!p) return;
  const reason = prompt('调价原因：','行情调整')||'';
  await api(`/inventories/${id}/price`,'POST',{new_price:+p, reason});
  toast('改价成功，已留痕'); vInventory();
});
const doTransfer = run(async (id, avail)=>{
  const city = prompt('目的城市：','上海'); if(!city) return;
  const n = prompt(`调货扎数（可调 ${avail}）：`,'5'); if(!n) return;
  await api('/transfers','POST',{inventory_id:id, bundles:+n, to_city:city});
  toast('调货单已创建，等待配送发车'); vInventory();
});

    <div class="row">
      <div><label>到货时段</label><select id="e_slot">${TIMESLOTS.map(t=>`<option>${t}</option>`).join('')}</select></div>
      <div><label>关联保温失败记录</label><select id="e_holding"><option value="">不关联</option>
        ${failedHolds.map(h=>`<option value="${h.id}">${h.batch_no}（${HOLD_METHOD[h.method]}失败）</option>`).join('')}</select></div>
      <div><label>调整原因</label><input id="e_reason" placeholder="如 洋桔梗保温失败，高敏感花材滞留" style="width:220px"></div>
      <div><label>调整后入场顺序</label><input id="e_detail" placeholder="如 高敏感优先进场，低敏感顺延至 04:00 后" style="width:260px"></div>
      <div><button onclick="createAdjustment()">发布并通知经纪人</button></div>
    </div>
    <div class="muted">发布后通知全体经纪人；经纪人确认后生效。</div></div>`;
  }
  const canBrokerConfirm = a => role==='broker' && a.status==='pending' && (!a.broker_id || a.broker_id===S.me.id);
  html += `
  <div class="card"><h3>入场顺序调整</h3>
    <table><tr><th>#</th><th>时段</th><th>原因</th><th>调整后顺序</th><th>状态</th><th>确认人</th><th>发起</th><th>时间</th>${role==='broker'?'<th>操作</th>':''}</tr>
    ${adjustments.map(a=>`<tr><td>${a.id}</td><td>${badge(a.time_slot,'p')}</td>
      <td style="white-space:normal;max-width:220px">${esc(a.reason)}</td>
      <td style="white-space:normal;max-width:260px">${esc(a.detail)}</td>
      <td>${stBadge(ESTATUS,a.status)}</td>
      <td>${a.confirmed_name?esc(a.confirmed_name)+' '+fmtT(a.confirmed_at):'—'}</td>
      <td>${esc(a.created_by)}</td><td>${fmtT(a.created_at)}</td>
      ${role==='broker'?`<td>${canBrokerConfirm(a)?`<button class="small green" onclick="confirmAdjustment(${a.id})">确认</button>`:''}</td>`:''}
      </tr>`).join('')||'<tr><td colspan=9 class=muted>暂无入场调整</td></tr>'}</table></div>`;

  $('#view').innerHTML = html;
}
const createHolding = run(async ()=>{
  await api('/holdings','POST',{batch_id:+$('#h_batch').value, method:$('#h_method').value,
    responsibility:$('#h_resp').value, note:$('#h_note').value});
  toast('已登记临时保温'); vColdchain();
});
const failHolding = run(async id=>{
  const note = prompt('保温失败说明（花材开放过快）：','冰袋耗尽，箱温升高，花材开放过快'); if(!note) return;
  const comp = prompt('损耗赔付金额（元，双签后计入结算）：','200'); if(comp===null) return;
  await api(`/holdings/${id}/fail`,'POST',{failure_note:note, compensation:+comp||0});
  toast('已上报保温失败，等待冷库与批发商双方确认责任'); vColdchain();
});
const confirmHolding = run(async id=>{
  const r = prompt('认定责任方 coldstore冷库/wholesaler批发商/farmer花农/broker经纪人：','coldstore'); if(!r) return;
  const j = await api(`/holdings/${id}/confirm`,'POST',{responsibility:r.trim()});
  toast(j.final_responsibility?`双方已确认，最终定责：${RESP[j.final_responsibility]||j.final_responsibility}`:'已确认，等待另一方确认');
  vColdchain();
});
const storeHolding = run(async id=>{
  const j = await api(`/holdings/${id}/store`,'POST',{slot_id:+$(`#hs_slot_${id}`).value});
  toast(`已转入库 ${j.slot_code}`); vColdchain();
});
const reviewHolding = run(async id=>{
  const cause = prompt('根因分析：','冰袋储备不足，高敏感花材滞留月台过久'); if(!cause) return;
  const imp = prompt('改进措施：','高敏感花材优先入库，冰袋按 120% 备货'); if(!imp) return;
  await api(`/holdings/${id}/reviews`,'POST',{root_cause:cause, improvement:imp});
  toast('复盘已记录，已同步市场管理方'); vColdchain();
});
const createAdjustment = run(async ()=>{
  const body = {time_slot:$('#e_slot').value, reason:$('#e_reason').value, detail:$('#e_detail').value};
  if($('#e_holding').value) body.holding_id = +$('#e_holding').value;
  await api('/entry-adjustments','POST',body);
  toast('入场调整已发布，已通知经纪人确认'); vColdchain();
});
const confirmAdjustment = run(async id=>{
  await api(`/entry-adjustments/${id}/confirm`,'POST',{});
  toast('已确认入场顺序调整'); vColdchain();
});

const VIEWS = { dash:vDash, batches:vBatches, qc:vQC, storage:vStorage, auctions:vAuctions,
  inventory:vInventory, market:vMarket, orders:vOrders, deliveries:vDeliveries,
  returns:vReturns, finance:vFinance, admin:vAdmin, coldchain:vColdchain };

/* ---------------- 启动 ---------------- */
(async function(){
  renderLogin();
  if(S.token && S.me){
    try { await api('/auth/me'); enter(); return; }
    catch(e){ /* token 失效 */ }
  }
  $('#loginView').style.display='block';
})();
</script>
