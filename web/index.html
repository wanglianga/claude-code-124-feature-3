<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>凌晨鲜花批发市场 · 竞价分货与损耗服务</title>
<style>
  :root { --bg:#0f141b; --card:#1a2230; --line:#2a3547; --txt:#e8eef7; --dim:#8fa0b8;
          --acc:#ff5d8f; --acc2:#3ec6a7; --warn:#ffb020; --bad:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
         background:var(--bg); color:var(--txt); }
  header { display:flex; align-items:center; gap:12px; padding:12px 20px; background:var(--card);
           border-bottom:1px solid var(--line); position:sticky; top:0; z-index:9; }
  header h1 { font-size:17px; margin:0; }
  header .who { margin-left:auto; color:var(--dim); font-size:13px; }
  button { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:7px 14px;
           cursor:pointer; font-size:13px; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--txt); }
  button.small { padding:3px 9px; font-size:12px; }
  button.green { background:var(--acc2); }
  button.warn { background:var(--warn); color:#222; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  input,select,textarea { background:#0d1219; color:var(--txt); border:1px solid var(--line);
           border-radius:7px; padding:7px 9px; font-size:13px; }
  label { font-size:12px; color:var(--dim); display:block; margin:8px 0 3px; }
  .layout { display:flex; min-height:calc(100vh - 53px); }
  nav { width:168px; padding:14px 10px; border-right:1px solid var(--line); flex-shrink:0; }
  nav a { display:block; padding:9px 12px; border-radius:8px; color:var(--dim); cursor:pointer;
          font-size:14px; margin-bottom:4px; text-decoration:none; }
  nav a.on { background:var(--acc); color:#fff; }
  main { flex:1; padding:18px 22px; overflow-x:auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:16px; margin-bottom:16px; }
  .card h3 { margin:0 0 12px; font-size:15px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { padding:7px 8px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
  th { color:var(--dim); font-weight:500; }
  .badge { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px;
           background:#26314a; color:var(--dim); }
  .badge.g { background:rgba(62,198,167,.18); color:var(--acc2); }
  .badge.y { background:rgba(255,176,32,.16); color:var(--warn); }
  .badge.r { background:rgba(255,107,107,.16); color:var(--bad); }
  .badge.p { background:rgba(255,93,143,.16); color:var(--acc); }
  .grid { display:grid; gap:14px; }
  .grid.c4 { grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .stat .n { font-size:24px; font-weight:600; }
  .stat .t { color:var(--dim); font-size:12px; margin-top:4px; }
  .bar { height:8px; background:#0d1219; border-radius:99px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--acc2); }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
  .muted { color:var(--dim); font-size:12px; }
  .err { color:var(--bad); font-size:13px; margin:8px 0; }
  .ok { color:var(--acc2); font-size:13px; margin:8px 0; }
  #toast { position:fixed; top:64px; right:20px; z-index:99; display:flex; flex-direction:column; gap:8px; }
  #toast div { background:#26314a; border:1px solid var(--line); padding:10px 16px; border-radius:9px;
               font-size:13px; max-width:360px; }
  #toast div.e { border-color:var(--bad); color:var(--bad); }
  .login-wrap { max-width:460px; margin:8vh auto; }
  .acct { display:inline-block; margin:3px; }
  h4.sec { margin:18px 0 8px; color:var(--dim); font-weight:500; }
</style>
</head>
<body>
<div id="toast"></div>
<header>
  <h1>🌹 凌晨鲜花批发市场 · 竞价分货与损耗服务</h1>
  <span class="who" id="who"></span>
  <button class="ghost small" id="notifyBtn" style="display:none" onclick="go('notify')">通知</button>
  <button class="ghost small" id="logoutBtn" style="display:none" onclick="logout()">退出登录</button>
</header>

<div id="loginView" class="login-wrap" style="display:none">
  <div class="card">
    <h3>登录市场工作台</h3>
    <label>用户名</label>
    <input id="loginUser" style="width:100%" placeholder="如 farmer01">
    <label>密码</label>
    <input id="loginPass" type="password" style="width:100%" placeholder="演示账号统一 flower123">
    <div class="err" id="loginErr"></div>
    <button style="width:100%;margin-top:10px" onclick="doLogin()">登 录</button>
    <h4 class="sec">演示账号一键填充（密码均为 flower123）</h4>
    <div id="acctList"></div>
  </div>
</div>

<div id="appView" class="layout" style="display:none">
  <nav id="menu"></nav>
  <main id="view"></main>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CAT = {rose:'玫瑰',lily:'百合',tulip:'郁金香',eustoma:'洋桔梗',eucalyptus:'尤加利',holiday_mix:'节日混搭'};
const PURPOSE = {wedding:'婚礼',retail:'门店零售',livestream:'直播花束',enterprise:'企业订单'};
const REASON = {petal_drop:'到店掉瓣',quality:'品质不符',temp_damage:'冷链失温',short_stem:'短枝过多',other:'其他'};
const ROLE = {farmer:'花农',broker:'经纪人',qc:'质检',wholesaler:'批发商',shop:'花店采购',coldstore:'冷库',logistics:'配送',finance:'财务',manager:'市场管理'};
const BSTATUS = {qc_pending:'待质检',qc_passed:'质检通过',qc_flagged:'质检打回',stored:'已入库',in_auction:'竞价中',sold:'已售出',expired:'已报损',closed:'已出清'};
const ASTATUS = {active:'进行中',closed:'已成交',unsold:'流拍',cancelled:'已取消'};
const OSTATUS = {pending_payment:'待付款',paid:'已付款',dispatched:'配送中',delivered:'已送达',completed:'已完成',cancelled:'已取消',timeout_cancelled:'超时取消'};
const RSTATUS = {requested:'待审核',approved:'已赔付',rejected:'已驳回'};
const RECV = {open:'未到期',overdue:'已逾期',settled:'已结清'};
const TSTATUS = {pending:'待发车',in_transit:'在途',delivered:'已送达',arrived:'已到达'};
const TEMPM = {ice_pack:'加冰瓶/冰袋',quilt:'保温棉被',ventilated:'通风暂存区',shadow:'遮阳阴凉处',fan:'风机降温',other:'其他临时措施'};
const LOSSRESP = {farmer:'花农承担',coldstore:'冷库承担',wholesaler:'批发商承担',shared:'共同承担'};
const QSTATUS = {waiting:'等待入库',admitted:'已放行入库',failed:'临时保温失败',released:'货主已拉走',expired:'已过期'};
const INCSTATUS = {pending:'待双方确认',confirmed:'双方已确认·待复盘',reviewed:'已复盘结案'};
const ADJSTATUS = {proposed:'拟议中',notified:'待经纪人确认',confirmed:'经纪人已确认',rejected:'经纪人有异议'};
const money = n => '¥' + Number(n||0).toFixed(2);
const fmtT = s => s ? new Date(s).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
const badge = (txt,cls='') => `<span class="badge ${cls}">${txt}</span>`;
const stBadge = (map,v) => { const c = /报损|打回|驳回|取消|逾期|超时/.test(map[v]||v)?'r':(/待|在途|进行中|锁定/.test(map[v]||v)?'y':(/售|成交|送达|付款|通过|赔付|到达|结清/.test(map[v]||v)?'g':'')); return badge(map[v]||v,c); };
const flagsTxt = f => (f||'').split(',').filter(Boolean).map(x=>({uneven_openness:'开放度不均',high_short_stem:'短枝比例高',temp_abnormal:'冷链失温'}[x]||x)).join('、');

let S = { token: localStorage.getItem('fm_tok')||'', me: JSON.parse(localStorage.getItem('fm_me')||'null'), view:'' };

function toast(msg, isErr){
  const d = document.createElement('div');
  if(isErr) d.className='e';
  d.textContent = msg;
  $('#toast').appendChild(d);
  setTimeout(()=>d.remove(), isErr?6000:3000);
}

async function api(path, method='GET', body){
  const opt = { method, headers: {} };
  if(S.token) opt.headers['Authorization'] = 'Bearer '+S.token;
  if(body !== undefined){ opt.headers['Content-Type']='application/json'; opt.body = JSON.stringify(body); }
  const r = await fetch('/api'+path, opt);
  let j = null;
  try { j = await r.json(); } catch(e){}
  if(!r.ok){
    if(r.status===401){ logout(); }
    throw new Error((j&&j.error)||('HTTP '+r.status));
  }
  return j;
}
const run = fn => async (...a) => { try { await fn(...a); } catch(e){ toast(e.message, true); } };

const ACCOUNTS = [
  ['farmer01','花农·昆明老张'],['farmer02','花农·凌源小李'],['broker01','经纪人·王姐'],
  ['qc01','质检员·陈工'],['wholesaler01','批发商·恒信'],['wholesaler02','批发商·馨源'],
  ['shop01','花店·城南花坊'],['shop02','婚庆·喜结良缘(账期)'],['shop03','花店·直播小艾'],
  ['cold01','冷库·赵班长'],['ship01','配送·孙师傅'],['fin01','财务·刘会计'],['boss01','市场管理·吴经理'],
];

function renderLogin(){
  $('#acctList').innerHTML = ACCOUNTS.map(a=>
    `<button class="ghost small acct" onclick="$('#loginUser').value='${a[0]}';$('#loginPass').value='flower123'">${a[1]}</button>`).join('');
}
async function doLogin(){
  $('#loginErr').textContent = '';
  try{
    const j = await api('/auth/login','POST',{username:$('#loginUser').value.trim(),password:$('#loginPass').value});
    S.token = j.token; S.me = j.user;
    localStorage.setItem('fm_tok', j.token);
    localStorage.setItem('fm_me', JSON.stringify(j.user));
    enter();
  }catch(e){ $('#loginErr').textContent = e.message; }
}
function logout(){
  if(S.token) api('/auth/logout','POST').catch(()=>{});
  S.token=''; S.me=null;
  localStorage.removeItem('fm_tok'); localStorage.removeItem('fm_me');
  location.reload();
}

const MENUS = {
  farmer:     [['batches','到货登记'],['coldchain','冷库调度'],['notify','通知'],['dash','市场看板']],
  broker:     [['batches','到货登记'],['coldchain','冷库调度'],['notify','通知'],['dash','市场看板']],
  qc:         [['qc','质检台'],['returns','退货审核'],['storage','冷库与保鲜'],['coldchain','冷库调度'],['notify','通知'],['dash','市场看板']],
  wholesaler: [['coldchain','冷库调度'],['auctions','凌晨竞价大厅'],['inventory','我的库存'],['orders','销售订单'],['notify','通知'],['dash','市场看板']],
  shop:       [['market','采购市场'],['orders','我的订单'],['dash','市场看板']],
  coldstore:  [['coldchain','冷库调度'],['storage','冷库与保鲜'],['notify','通知'],['dash','市场看板']],
  logistics:  [['deliveries','配送调度'],['dash','市场看板']],
  finance:    [['finance','财务结算'],['dash','市场看板']],
  manager:    [['dash','市场看板'],['coldchain','冷库调度'],['admin','拍卖管理'],['auctions','竞价大厅'],['returns','退货对账'],['finance','财务结算'],['notify','通知']],
};

function enter(){
  $('#loginView').style.display='none';
  $('#appView').style.display='flex';
  $('#logoutBtn').style.display='';
  $('#who').textContent = `${S.me.name}（${ROLE[S.me.role]||S.me.role}）`;
  const menu = MENUS[S.me.role]||[['dash','市场看板']];
  $('#menu').innerHTML = menu.map(m=>`<a data-v="${m[0]}" onclick="go('${m[0]}')">${m[1]}</a>`).join('');
  if(menu.some(m=>m[0]==='notify')){
    $('#notifyBtn').style.display='';
    refreshUnread();
    setInterval(refreshUnread, 30000);
  }
  go(menu[0][0]);
}
async function refreshUnread(){
  try{
    const n = await api('/notifications?unread=1');
    $('#notifyBtn').textContent = n.unread_count>0 ? `通知 (${n.unread_count})` : '通知';
  }catch(e){}
}
function go(v){
  S.view = v;
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on', a.dataset.v===v));
  VIEWS[v]();
}

/* ---------------- 看板 ---------------- */
async function vDash(){
  const [ov, st, rank] = await Promise.all([
    api('/analytics/overview'), api('/analytics/stability'), api('/farmers/ranking')]);
  const c = ov.counts||{};
  const occ = (ov.storage_slots||[]).reduce((a,s)=>a+s.occupied_bundles,0);
  const cap = (ov.storage_slots||[]).reduce((a,s)=>a+s.capacity_bundles,0);
  const overdue = (ov.credit_risk||[]).reduce((a,x)=>a+x.overdue_amount,0);
  const retClaim = (ov.return_loss||[]).reduce((a,x)=>a+x.claim_amount,0);
  $('#view').innerHTML = `
  <div class="grid c4">
    <div class="stat"><div class="n">${c.active_auctions||0}</div><div class="t">进行中的凌晨竞价</div></div>
    <div class="stat"><div class="n">${occ}/${cap}</div><div class="t">冷库占用（扎）</div></div>
    <div class="stat"><div class="n">${money(retClaim)}</div><div class="t">累计退货赔付</div></div>
    <div class="stat"><div class="n" style="color:var(--bad)">${money(overdue)}</div><div class="t">账期逾期金额</div></div>
    <div class="stat"><div class="n">${c.pending_orders||0}</div><div class="t">待付款订单</div></div>
    <div class="stat"><div class="n">${c.timeout_orders||0}</div><div class="t">超时未付款取消</div></div>
    <div class="stat"><div class="n">${c.requested_returns||0}</div><div class="t">待审核退货</div></div>
    <div class="stat"><div class="n">${c.expired_batches||0}</div><div class="t">报损批次</div></div>
    <div class="stat"><div class="n" style="color:var(--warn)">${c.cold_waiting||0}</div><div class="t">冷库爆满·等待入库</div></div>
    <div class="stat"><div class="n" style="color:var(--bad)">${c.cold_incidents_pending||0}</div><div class="t">保温失败·待双方确认</div></div>
    <div class="stat"><div class="n">${c.cold_incidents_confirmed||0}</div><div class="t">事故待冷库复盘</div></div>
    <div class="stat"><div class="n" style="color:var(--acc)">${c.entry_adjust_notified||0}</div><div class="t">入场调整待经纪人确认</div></div>
  </div>
  <div class="card"><h3>成交速度（按品类 / 产地）</h3>
    <table><tr><th>品类</th><th>产地</th><th>成交笔数</th><th>平均成交耗时</th><th>成交金额</th></tr>
    ${(ov.deal_speed||[]).map(x=>`<tr><td>${CAT[x.category]||x.category}</td><td>${esc(x.origin)}</td>
      <td>${x.deals}</td><td>${x.avg_minutes} 分钟</td><td>${money(x.amount)}</td></tr>`).join('')||'<tr><td colspan=5 class=muted>暂无成交</td></tr>'}</table></div>
  <div class="card"><h3>冷库占用</h3>
    <div class="grid c4">${(ov.storage_slots||[]).map(s=>`
      <div><div style="display:flex;justify-content:space-between;font-size:13px">
        <b>${s.code}</b><span class="muted">${s.occupied_bundles}/${s.capacity_bundles} 扎</span></div>
      <div class="bar"><i style="width:${Math.min(100,s.occupied_bundles/s.capacity_bundles*100)}%"></i></div></div>`).join('')}</div></div>
  <div class="card"><h3>退货损耗（按品类 / 产地）</h3>
    <table><tr><th>品类</th><th>产地</th><th>售出(扎)</th><th>退货(扎)</th><th>退货率</th><th>赔付金额</th></tr>
    ${(ov.return_loss||[]).map(x=>`<tr><td>${CAT[x.category]||x.category}</td><td>${esc(x.origin)}</td>
      <td>${x.sold_bundles}</td><td>${x.returned_bundles}</td><td>${x.return_rate_pct}%</td><td>${money(x.claim_amount)}</td></tr>`).join('')||'<tr><td colspan=6 class=muted>暂无</td></tr>'}</table></div>
  <div class="card"><h3>账期风险</h3>
    <table><tr><th>账期客户</th><th>额度</th><th>未到期</th><th>已逾期</th><th>最长逾期</th></tr>
    ${(ov.credit_risk||[]).map(x=>`<tr><td>${esc(x.customer)}</td><td>${money(x.credit_limit)}</td>
      <td>${money(x.open_amount)}</td><td>${x.overdue_amount>0?badge(money(x.overdue_amount),'r'):money(0)}</td>
      <td>${x.max_overdue_days} 天</td></tr>`).join('')||'<tr><td colspan=5 class=muted>暂无账期客户</td></tr>'}</table></div>
  <div class="card"><h3>产地 × 品类稳定性（辅助调整凌晨拍卖秩序）</h3>
    <table><tr><th>产地</th><th>品类</th><th>批次数</th><th>质检均分</th><th>冷链达标率</th><th>退货率</th><th>稳定性评分</th></tr>
    ${st.map(x=>`<tr><td>${esc(x.origin)}</td><td>${CAT[x.category]||x.category}</td><td>${x.batches}</td>
      <td>${x.grade_avg}</td><td>${x.temp_ok_rate}%</td><td>${x.return_rate_pct}%</td>
      <td>${badge(x.stability_score, x.stability_score>=75?'g':(x.stability_score>=55?'y':'r'))}</td></tr>`).join('')}</table></div>
  <div class="card"><h3>花农信用排名（决定下次竞价排序）</h3>
    <table><tr><th>名次</th><th>花农</th><th>信用分</th></tr>
    ${rank.map(x=>`<tr><td>${x.rank}</td><td>${esc(x.name)}</td>
      <td>${badge(x.credit_score, x.credit_score>=95?'g':(x.credit_score>=80?'y':'r'))}</td></tr>`).join('')}</table></div>`;
}

/* ---------------- 到货登记（花农/经纪人） ---------------- */
async function vBatches(){
  const [batches, farmers] = await Promise.all([
    api('/batches'), S.me.role==='broker' ? api('/farmers') : Promise.resolve([])]);
  const isBroker = S.me.role==='broker';
  $('#view').innerHTML = `
  <div class="card"><h3>凌晨到货登记</h3>
    <div class="row">
      ${isBroker?`<div><label>代录花农</label><select id="b_farmer">${farmers.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></div>`:''}
      <div><label>品类</label><select id="b_cat">${Object.entries(CAT).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
      <div><label>产地</label><input id="b_origin" value="云南昆明"></div>
      <div><label>采切时间</label><input id="b_cut" type="datetime-local"></div>
      <div><label>枝长(cm)</label><input id="b_stem" type="number" value="60" style="width:80px"></div>
      <div><label>开放度(1-5)</label><input id="b_open" type="number" step="0.5" min="1" max="5" value="3" style="width:70px"></div>
      <div><label>扎数</label><input id="b_bundles" type="number" value="50" style="width:80px"></div>
      <div><label>每扎枝数</label><input id="b_spb" type="number" value="20" style="width:70px"></div>
      <div><label>冷链到货温度(℃)</label><input id="b_temp" type="number" step="0.1" value="5" style="width:90px"></div>
      <div><label>可售时长(小时)</label><input id="b_sell" type="number" value="48" style="width:90px"></div>
      <div><button onclick="createBatch()">提交登记</button></div>
    </div>
    <div class="muted" style="margin-top:6px">冷链温度 &gt; 8℃ 将自动打上「冷链失温」风险标。</div>
  </div>
  <div class="card"><h3>${isBroker?'我代录的批次':'我的批次'}</h3>

        <td>${x.bundles}</td><td>${money(x.claim_amount)}</td><td>${stBadge(RSTATUS,x.status)}</td>
        <td>${x.farmer_responsible?badge('是','r'):'—'}</td></tr>`).join('')||'<tr><td colspan=10 class=muted>本月暂无退货</td></tr>'}</table></div>`;
  }

  <div class="card"><h3>退货${isQC?'审核':'列表'}</h3>
    <table><tr><th>#</th><th>订单</th><th>批次</th><th>花店</th><th>原因</th><th>扎数</th><th>损耗比</th><th>索赔</th><th>状态</th><th>裁定备注</th>${isQC?'<th>操作</th>':''}</tr>
    ${list.map(x=>`<tr><td>${x.id}</td><td>${x.order_no}</td><td>${x.batch_no}</td><td>${esc(x.shop_name)}</td>
      <td>${REASON[x.reason]||x.reason}</td><td>${x.bundles}</td><td>${Math.round(x.loss_ratio*100)}%</td>
      <td>${money(x.claim_amount)}</td><td>${stBadge(RSTATUS,x.status)}</td><td>${esc(x.review_note)||'—'}</td>

      </tr>`).join('')||'<tr><td colspan=11 class=muted>暂无退货</td></tr>'}</table>
    ${isQC?'<div class="muted" style="margin-top:6px">裁定时勾选「花农责任」将扣减花农信用分，影响其下次竞价排序。</div>':''}</div>
  ${reconHTML}`;
}
const review = run(async (id, approve)=>{
  let responsible = false, note = '';
  if(approve){
    responsible = confirm('是否判定为花农责任（将扣花农信用分）？');
    note = prompt('裁定备注：','到店损耗属实')||'';
  } else {
    note = prompt('驳回原因：','证据不足')||'';
  }
  const j = await api(`/returns/${id}/review`,'POST',{approve, farmer_responsible:responsible, note});
  toast(`已${approve?'赔付':'驳回'}${j.credit_delta?`，花农信用 ${j.credit_delta}`:''}`); vReturns();
});

        ${isMgr&&x.status==='reviewed'&&!x.adjustment_id?`<button class="small" onclick="createAdjustment(${x.id})">发起入场顺序调整</button>`:''}
        ${x.adjustment_id?badge('已发起入场调整 #'+x.adjustment_id,'p'):''}
      </td></tr>`).join('')||'<tr><td colspan=9 class=muted>暂无事故</td></tr>'}</table></div>

  <div class="card"><h3>凌晨入场顺序调整（通知经纪人并由其确认）</h3>
    <table><tr><th>#</th><th>事故</th><th>批次/品类</th><th>调整时段</th><th>生效日</th><th>调整内容</th><th>批发商</th><th>经纪人</th><th>状态</th><th>经纪人反馈</th>${isBroker?'<th>操作</th>':''}</tr>
    ${adjusts.map(e=>`<tr>
      <td>${e.id}</td><td>#${e.incident_id}</td><td>${e.batch_no} ${e.category_cn}</td>
      <td>${esc(e.time_window)}</td><td>${e.effective_date}</td>
      <td style="white-space:normal;max-width:280px">${esc(e.adjustment)}</td>
      <td>${esc(e.wholesaler_name)||'—'}</td><td>${esc(e.broker_name)||'全体经纪人'}</td>
      <td>${stBadge(ADJSTATUS,e.status)}</td><td style="white-space:normal">${esc(e.broker_note)||'—'}</td>
      ${isBroker?`<td>${e.status==='notified'||e.status==='proposed'?
        `<button class="small green" onclick="confirmAdjust(${e.id},true)">确认</button>
         <button class="small ghost" onclick="confirmAdjust(${e.id},false)">异议</button>`:'—'}</td>`:''}
    </tr>`).join('')||'<tr><td colspan=10 class=muted>暂无入场调整</td></tr>'}</table></div>`;

  const d = new Date(Date.now()+2*3600e3);
  if($('#eq_eta')) $('#eq_eta').value = new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,16);
}
const saveSens = run(async cat=>{
  await api(`/coldchain/sensitivity/${cat}`,'PUT',{sensitivity:+$(`#se_${cat}`).value,temp_window:$(`#st_${cat}`).value});
  toast('敏感度已保存'); vColdChain();
});
const enqueueBatch = run(async ()=>{
  const j = await api('/coldchain/queue','POST',{
    batch_id:+$('#eq_batch').value, pickup_eta:$('#eq_eta').value,
    temp_method:$('#eq_method').value, loss_responsibility:$('#eq_resp').value, loss_note:$('#eq_note').value});
  toast(`批次 ${j.batch_no} 已登记临时保温并入队（敏感度 ${j.sensitivity}）`); vColdChain();
});
const admitQueue = run(async id=>{
  const j = await api(`/coldchain/queue/${id}/admit`,'POST',{slot_id:+$(`#ad_slot_${id}`).value});
  toast(`已放行入库：${j.slot_code}`); vColdChain();
});
const releaseQueue = run(async id=>{
  if(!confirm('确定将该批次移出等待队列（货主拉走/改投其他冷库）？')) return;
  await api(`/coldchain/queue/${id}/release`,'POST',{});
  toast('已移出队列'); vColdChain();
});
const reportIncident = run(async ()=>{
  const j = await api('/coldchain/incidents','POST',{
    batch_id:+$('#ic_batch').value, openness_before:+$('#ic_before').value, openness_after:+$('#ic_after').value,
    temp_method:$('#ic_method').value, description:$('#ic_desc').value});
  toast(`事故 #${j.id} 已上报，已通知冷库负责人与批发商确认责任`); vColdChain();
});
const confirmIncident = run(async (id,side)=>{
  const responsible = confirm('是否判定本方承担责任（确定=担责，取消=无责）？');
  const note = prompt('确认备注：', responsible?'认可保温失败责任':'保温措施到位/责任不在己方')||'';
  const j = await api(`/coldchain/incidents/${id}/confirm`,'POST',{side,responsible,note});
  toast(j.both_confirmed?'双方责任已确认，请冷库端复盘':'责任确认已提交'); vColdChain();
});
const reviewIncident = run(async id=>{
  const note = prompt('冷库端复盘结论与改进措施：','增配临时冷藏车，高峰时段加密巡视频次')||'';
  if(!note) return;
  await api(`/coldchain/incidents/${id}/review`,'POST',{note});
  toast('冷库复盘完成，市场可据此调整入场顺序'); vColdChain();
});
const createAdjustment = run(async id=>{
  const tw = prompt('调整时段：','03:00-05:00'); if(!tw) return;
  const adj = prompt('入场顺序调整内容：','已成交高敏感花材优先进场，经纪人代录批次提前30分钟到场'); if(!adj) return;
  const j = await api(`/coldchain/incidents/${id}/adjustment`,'POST',{time_window:tw,adjustment:adj});
  toast('入场顺序调整已通知经纪人，等待确认'); vColdChain();
});
const confirmAdjust = run(async (id,accept)=>{
  const note = prompt(accept?'确认备注：':'异议说明：', accept?'已知悉并配合调整':'该时段到场存在困难，建议改期')||'';
  const j = await api(`/coldchain/adjustments/${id}/confirm`,'POST',{accept,note});
  toast('已'+(accept?'确认':'反馈异议')+'，状态：'+j.status); vColdChain();
});

/* ---------------- 通知 ---------------- */
async function vNotify(){
  const n = await api('/notifications');
  $('#view').innerHTML = `
  <div class="card"><h3>站内通知 <span class="muted">（未读 ${n.unread_count}）</span>
    <button class="small ghost" style="margin-left:10px" onclick="readAllNotify()">全部已读（不含待确认项）</button></h3>
    <table><tr><th>#</th><th>类型</th><th>标题</th><th>内容</th><th>状态</th><th>时间</th><th>操作</th></tr>
    ${n.items.map(x=>`<tr>
      <td>${x.id}</td><td>${({entry_adjustment:'入场调整',incident:'保温事故',queue:'排队'})[x.type]||x.type}</td>
      <td style="white-space:normal">${esc(x.title)}</td><td style="white-space:normal;max-width:380px">${esc(x.body)}</td>
      <td>${x.need_ack?badge('待确认','p'):(x.is_read?'已读':badge('未读','y'))}</td>
      <td>${fmtT(x.created_at)}</td>
      <td>${x.is_read?'—':`<button class="small ghost" onclick="readNotify(${x.id})">已读</button>`}
        ${x.need_ack&&x.ref_type==='adjustment'?`<button class="small green" onclick="go('coldchain')">去确认</button>`:''}</td>
    </tr>`).join('')||'<tr><td colspan=7 class=muted>暂无通知</td></tr>'}</table></div>`;
}
const readNotify = run(async id=>{ await api(`/notifications/${id}/read`,'POST',{}); vNotify(); });
const readAllNotify = run(async ()=>{ await api('/notifications/read-all','POST',{}); toast('已全部标为已读'); vNotify(); });

const VIEWS = { dash:vDash, batches:vBatches, qc:vQC, storage:vStorage, auctions:vAuctions,
  inventory:vInventory, market:vMarket, orders:vOrders, deliveries:vDeliveries,
  returns:vReturns, finance:vFinance, admin:vAdmin, coldchain:vColdChain, notify:vNotify };

/* ---------------- 启动 ---------------- */
(async function(){
  renderLogin();
  if(S.token && S.me){
    try { await api('/auth/me'); enter(); return; }
    catch(e){ /* token 失效 */ }
  }
  $('#loginView').style.display='block';
})();
</script>
